<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Acesso seguro ao sistema Garagem Auto Car"><meta name="theme-color" content="#090a0b"><title>Entrar | Garagem Auto Car</title><link rel="icon" type="image/png" href="assets/garagem-auto-car-logo.png"><link rel="stylesheet" href="css/global.css"></head>
<body class="login-page"><main class="login-card"><div class="login-brand"><img class="brand-logo" src="assets/garagem-auto-car-logo.png" alt="Garagem Auto Car"><span><strong>GARAGEM AUTO CAR</strong><br><small>GESTÃO DE OFICINA</small></span></div><h1>Bem-vindo de volta</h1><p>Entre com sua conta autorizada.</p><div class="setup-banner">Configure o Firebase em <strong>js/firebase/firebase-config.js</strong> para ativar o acesso.</div><form id="login-form" class="login-form"><div class="field"><label for="email">E-mail</label><input class="input" id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Senha</label><div class="password-field"><input class="input" id="password" type="password" autocomplete="current-password" required><button class="btn btn-icon" type="button" id="toggle-password" aria-label="Mostrar senha"></button></div></div><label class="checkbox-row"><input id="remember" type="checkbox"> Manter conectado</label><div id="login-error" class="error-text" role="alert"></div><button class="btn btn-primary" type="submit">Entrar</button><button class="btn" type="button" id="forgot-password">Esqueci minha senha</button></form></main><script type="module" src="js/login.js"></script></body></html>
